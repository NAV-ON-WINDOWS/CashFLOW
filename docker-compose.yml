version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mycams_backend
    ports:
      - "8000:8000"
    volumes:
      # Persists the SQLite database on your host machine
      - ./backend/portfolio.db:/app/portfolio.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mycams_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped